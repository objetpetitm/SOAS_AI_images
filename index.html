<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Country Images — Mosaic Gallery</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080c12;
    --panel: #0e1420;
    --border: #1e2a3a;
    --text: #e0e8f0;
    --muted: #6a8098;
    --accent: #4a9eff;
    --shadow: rgba(0,0,0,0.7);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #0a0f1e 0%, #0e1a2e 50%, #0a1520 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }
  header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    background: linear-gradient(90deg, #4a9eff, #a78bfa, #34d399);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 14px;
  }
  .stats-bar {
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .stat-chip {
    background: rgba(74,158,255,0.12);
    border: 1px solid rgba(74,158,255,0.3);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 0.78rem;
    color: #8ab8e8;
  }
  #count-display {
    font-size: 0.9rem;
    color: var(--muted);
    margin-left: auto;
  }
  #count-display span { color: var(--accent); font-weight: 600; }

  /* FILTER BAR */
  .filter-section {
    margin-bottom: 8px;
  }
  .filter-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .filter-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .pill {
    padding: 4px 11px;
    border-radius: 16px;
    font-size: 0.75rem;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s ease;
    user-select: none;
    opacity: 0.55;
    font-weight: 500;
  }
  .pill:hover { opacity: 0.85; transform: translateY(-1px); }
  .pill.active { opacity: 1; border-color: rgba(255,255,255,0.4); }
  .pill-all {
    background: rgba(74,158,255,0.15);
    border-color: rgba(74,158,255,0.4);
    color: #7bc4ff;
    opacity: 1;
  }
  .pill-all.active { background: rgba(74,158,255,0.35); }

  /* MOSAIC GRID */
  #mosaic {
    padding: 18px 18px 40px;
    columns: 6 180px;
    column-gap: 6px;
  }
  .card {
    break-inside: avoid;
    margin-bottom: 6px;
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    display: block;
    background: #111a27;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .card:hover { transform: scale(1.025); box-shadow: 0 8px 28px rgba(0,0,0,0.7); z-index: 10; }
  .card img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 6px;
    transition: filter 0.18s ease;
  }
  .card:hover img { filter: brightness(0.75); }

  /* Card overlay */
  .card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 55%);
    border-radius: 6px;
    opacity: 0;
    transition: opacity 0.18s ease;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 8px;
  }
  .card:hover .card-overlay { opacity: 1; }
  .card-country {
    font-size: 0.78rem;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
  }
  .card-meta {
    font-size: 0.65rem;
    color: rgba(255,255,255,0.65);
    margin-top: 2px;
  }

  /* Country badge (always visible) */
  .card-badge {
    position: absolute;
    top: 5px;
    left: 5px;
    padding: 2px 7px;
    border-radius: 10px;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    opacity: 0.9;
  }

  /* Empty state */
  #empty {
    display: none;
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    font-size: 1.1rem;
  }

  /* LIGHTBOX */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
    backdrop-filter: blur(4px);
  }
  #lightbox.open { display: flex; }
  #lb-inner {
    position: relative;
    max-width: 90vw;
    max-height: 90vh;
    cursor: default;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  #lb-img {
    max-width: 88vw;
    max-height: 80vh;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    object-fit: contain;
  }
  #lb-info {
    background: rgba(14,20,32,0.95);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 18px;
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  #lb-country { font-size: 1.05rem; font-weight: 700; color: #fff; }
  .lb-tag {
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
    color: #fff;
  }
  #lb-close {
    position: absolute;
    top: -12px;
    right: -12px;
    width: 32px;
    height: 32px;
    background: rgba(255,255,255,0.15);
    border: none;
    border-radius: 50%;
    color: #fff;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  #lb-close:hover { background: rgba(255,255,255,0.3); }
  #lb-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    justify-content: space-between;
    width: calc(100% + 80px);
    left: -40px;
    pointer-events: none;
  }
  .lb-arrow {
    width: 44px;
    height: 44px;
    background: rgba(255,255,255,0.12);
    border: none;
    border-radius: 50%;
    color: #fff;
    font-size: 1.3rem;
    cursor: pointer;
    pointer-events: all;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .lb-arrow:hover { background: rgba(255,255,255,0.28); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #080c12; }
  ::-webkit-scrollbar-thumb { background: #1e2a3a; border-radius: 3px; }

  @media (max-width: 600px) {
    #mosaic { columns: 2 140px; }
    header h1 { font-size: 1.1rem; }
  }
</style>
</head>

, "date": "241107", "country": "Zimbabwe", "category": "future", "lang": "ENG"}, {"file": "241107_Zimbabwe_city_future_SNA.jpg", "date": "241107", "country": "Zimbabwe", "category": "future", "lang": "SNA"}, {"file": "241111_India_ENG.jpg", "date": "241111", "country": "India", "category": "present", "lang": "ENG"}, {"file": "241111_India_HIN.jpg", "date": "241111", "country": "India", "category": "present", "lang": "HIN"}, {"file": "241111_India_city_ENG.jpg", "date": "241111", "country": "India", "category": "city", "lang": "ENG"}, {"file": "241111_India_city_HIN.jpg", "date": "241111", "country": "India", "category": "city", "lang": "HIN"}, {"file": "241111_India_city_future_ENG.jpg", "date": "241111", "country": "India", "category": "future", "lang": "ENG"}, {"file": "241111_India_city_future_HIN.jpg", "date": "241111", "country": "India", "category": "future", "lang": "HIN"}, {"file": "241111_Indonesia_IND.jpg", "date": "241111", "country": "Indonesia", "category": "present", "lang": "IND"}, {"file": "241111_Indonesia_city_ENG.jpg", "date": "241111", "country": "Indonesia", "category": "city", "lang": "ENG"}, {"file": "241111_Indonesia_city_IND.jpg", "date": "241111", "country": "Indonesia", "category": "city", "lang": "IND"}, {"file": "241111_Indonesia_city_future_ENG.jpg", "date": "241111", "country": "Indonesia", "category": "future", "lang": "ENG"}, {"file": "241111_Indonesia_city_future_IND.jpg", "date": "241111", "country": "Indonesia", "category": "future", "lang": "IND"}];
const COUNTRY_COLORS = {"Somalia": "#E8A020", "Zimbabwe": "#2E7D32", "Indonesia": "#C62828", "China": "#D32F2F", "SriLanka": "#F9A825", "SouthAfrica": "#6A1B9A", "India": "#E64A19", "Japan": "#B71C1C", "Kenya": "#1B5E20", "Ethiopia": "#0D47A1", "Canada": "#C62828", "Korea": "#00695C", "SouthKorea": "#1565C0", "NorthKorea": "#BF360C", "RepublicofKorea": "#1565C0", "Johannesburg": "#4527A0", "JJohannesburg": "#4527A0", "CapeTown": "#00838F", "Hindustan": "#E65100"};
const CAT_COLORS = {"present": "#1976D2", "city": "#388E3C", "future": "#7B1FA2"};
const LANG_NAMES = {"ENG": "English", "ZHO": "Chinese", "HIN": "Hindi", "IND": "Indonesian", "SOM": "Somali", "SNA": "Shona", "ZUL": "Zulu", "SWA": "Swahili", "SIN": "Sinhala", "TAM": "Tamil", "JPN": "Japanese", "KOR": "Korean", "AMH": "Amharic", "AFR": "Afrikaans", "FRA": "French", "XOS": "Xhosa", "BEN": "Bengali", "ASM": "Assamese", "UNK": "Unknown"};

const DEFAULT_COLOR = '#2d5a8e';
const mosaic = document.getElementById('mosaic');
const empty = document.getElementById('empty');
const visCount = document.getElementById('vis-count');

// State
let activeCountry = 'all';
let activeCat = 'all';
let activeLang = 'all';
let visibleIndices = [];
let lbIndex = 0;

// Build country pills
const countries = [...new Set(IMAGES.map(i => i.country))].sort();
const cpills = document.getElementById('country-pills');
countries.forEach(c => {
  const col = COUNTRY_COLORS[c] || DEFAULT_COLOR;
  const d = document.createElement('div');
  d.className = 'pill active';
  d.dataset.filter = 'country';
  d.dataset.value = c;
  d.textContent = c;
  d.style.background = col + '28';
  d.style.color = lighten(col);
  d.style.borderColor = col + '66';
  cpills.appendChild(d);
});

// Build lang pills
const langs = [...new Set(IMAGES.map(i => i.lang))].sort();
const lpills = document.getElementById('lang-pills');
langs.forEach(l => {
  const d = document.createElement('div');
  d.className = 'pill active';
  d.dataset.filter = 'lang';
  d.dataset.value = l;
  d.textContent = LANG_NAMES[l] || l;
  d.style.background = 'rgba(255,255,255,0.06)';
  d.style.color = '#a0bcd0';
  d.style.borderColor = 'rgba(255,255,255,0.15)';
  lpills.appendChild(d);
});

function lighten(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,r+80)},${Math.min(255,g+80)},${Math.min(255,b+80)})`;
}

// Build all cards
const cards = IMAGES.map((img, idx) => {
  const col = COUNTRY_COLORS[img.country] || DEFAULT_COLOR;
  const catCol = CAT_COLORS[img.category] || '#555';
  const div = document.createElement('div');
  div.className = 'card';
  div.dataset.country = img.country;
  div.dataset.cat = img.category;
  div.dataset.lang = img.lang;
  div.dataset.idx = idx;
  div.innerHTML = `
    <img src="images/${img.file}" alt="${img.country}" loading="lazy">
    <div class="card-badge" style="background:${col}cc">${img.country}</div>
    <div class="card-overlay">
      <div class="card-country">${img.country}</div>
      <div class="card-meta">${img.category} · ${LANG_NAMES[img.lang]||img.lang} · ${img.date}</div>
    </div>`;
  div.addEventListener('click', () => openLightbox(idx));
  mosaic.appendChild(div);
  return div;
});

function applyFilters() {
  visibleIndices = [];
  let shown = 0;
  cards.forEach((card, idx) => {
    const img = IMAGES[idx];
    const ok = (activeCountry === 'all' || img.country === activeCountry)
             && (activeCat === 'all' || img.category === activeCat)
             && (activeLang === 'all' || img.lang === activeLang);
    card.style.display = ok ? '' : 'none';
    if (ok) { visibleIndices.push(idx); shown++; }
  });
  visCount.textContent = shown;
  empty.style.display = shown === 0 ? 'block' : 'none';
}

// Filter clicks
document.querySelectorAll('.pill').forEach(pill => {
  pill.addEventListener('click', () => {
    const f = pill.dataset.filter, v = pill.dataset.value;
    if (f === 'country') {
      activeCountry = v;
      document.querySelectorAll('[data-filter="country"]').forEach(p => p.classList.toggle('active', p.dataset.value === v || v === 'all'));
      document.querySelector('[data-filter="country"][data-value="all"]').classList.toggle('active', v === 'all');
    } else if (f === 'cat') {
      activeCat = v;
      document.querySelectorAll('[data-filter="cat"]').forEach(p => p.classList.toggle('active', p.dataset.value === v || v === 'all'));
      document.querySelector('[data-filter="cat"][data-value="all"]').classList.toggle('active', v === 'all');
    } else if (f === 'lang') {
      activeLang = v;
      document.querySelectorAll('[data-filter="lang"]').forEach(p => p.classList.toggle('active', p.dataset.value === v || v === 'all'));
      document.querySelector('[data-filter="lang"][data-value="all"]').classList.toggle('active', v === 'all');
    }
    applyFilters();
  });
});

// Lightbox
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const lbCountry = document.getElementById('lb-country');
const lbCatTag = document.getElementById('lb-cat-tag');
const lbLangTag = document.getElementById('lb-lang-tag');
const lbDate = document.getElementById('lb-date');

function openLightbox(imgIdx) {
  lbIndex = visibleIndices.indexOf(imgIdx);
  if (lbIndex === -1) lbIndex = 0;
  showLb();
  lb.classList.add('open');
}

function showLb() {
  const idx = visibleIndices[lbIndex];
  const img = IMAGES[idx];
  const col = COUNTRY_COLORS[img.country] || DEFAULT_COLOR;
  const catCol = CAT_COLORS[img.category] || '#555';
  lbImg.src = 'images/' + img.file;
  lbCountry.textContent = img.country;
  lbCountry.style.color = lighten(col);
  lbCatTag.textContent = img.category;
  lbCatTag.style.background = catCol + 'aa';
  lbLangTag.textContent = LANG_NAMES[img.lang] || img.lang;
  lbDate.textContent = '📅 ' + formatDate(img.date);
}

function formatDate(d) {
  const y='20'+d.slice(0,2), m=d.slice(2,4), day=d.slice(4,6);
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[parseInt(m)-1]+' '+day+', '+y;
}

document.getElementById('lb-close').addEventListener('click', () => lb.classList.remove('open'));
lb.addEventListener('click', e => { if (e.target === lb) lb.classList.remove('open'); });
document.getElementById('lb-prev').addEventListener('click', e => {
  e.stopPropagation();
  lbIndex = (lbIndex - 1 + visibleIndices.length) % visibleIndices.length;
  showLb();
});
document.getElementById('lb-next').addEventListener('click', e => {
  e.stopPropagation();
  lbIndex = (lbIndex + 1) % visibleIndices.length;
  showLb();
});
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'ArrowLeft') { lbIndex = (lbIndex-1+visibleIndices.length)%visibleIndices.length; showLb(); }
  if (e.key === 'ArrowRight') { lbIndex = (lbIndex+1)%visibleIndices.length; showLb(); }
  if (e.key === 'Escape') lb.classList.remove('open');
});

// Init
applyFilters();
</script>
</body>
</html>
